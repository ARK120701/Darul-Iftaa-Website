<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fatwā — Darul Iftaa New York</title>
  <meta name="description" content="Read a Fatwā (Islamic legal ruling) issued by the muftīs of Darul Iftaa New York." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Poppins:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/fatwa-data.js"></script>
  <script src="js/bidi.js"></script>
  <script src="js/labels.js"></script>
  <style>
    .fatwa-detail-section { padding: 3rem 0 5rem; }
    .fatwa-detail-card {
      max-width: 1080px; margin: 0 auto; background: var(--white);
      border-radius: var(--radius-lg); border: 1px solid var(--border);
      box-shadow: var(--shadow); padding: 2.5rem 3rem 3rem;
    }
    @media (max-width: 640px) { .fatwa-detail-card { padding: 1.75rem 1.25rem 2.25rem; } }
    .fatwa-back-link {
      display: inline-flex; align-items: center; gap: .4rem; color: var(--text-muted);
      font-size: .85rem; font-weight: 600; margin-bottom: 1.25rem;
    }
    .fatwa-back-link:hover { color: var(--gold-dark); }
    .fatwa-detail-title { font-size: clamp(1.5rem, 3vw, 1.9rem); color: var(--navy); margin-bottom: 2rem; line-height: 1.3; }
    .fatwa-detail-date { font-size: .82rem; color: var(--text-muted); margin: 0; }

    .fatwa-cat-badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: .25rem .75rem; border-radius: 50px; }
    .cat-salah{background:rgba(26,75,140,.1);color:#1A4B8C}
    .cat-zakaat{background:rgba(201,162,39,.15);color:#9E7D18}
    .cat-sawm{background:rgba(46,134,193,.12);color:#1A6090}
    .cat-business{background:rgba(39,174,96,.12);color:#1E8449}
    .cat-food{background:rgba(231,76,60,.1);color:#B03A2E}
    .cat-marriage{background:rgba(155,89,182,.12);color:#7D3C98}
    .cat-divorce{background:rgba(192,57,43,.1);color:#922B21}
    .cat-purification{background:rgba(21,101,192,.1);color:#1565C0}
    .cat-funerals{background:rgba(69,69,69,.1);color:#424242}
    .cat-hajj{background:rgba(0,121,107,.1);color:#00695C}
    .cat-inheritance{background:rgba(74,20,140,.1);color:#4A148C}
    .cat-endowments{background:rgba(230,81,0,.1);color:#E65100}
    .cat-oaths{background:rgba(1,87,155,.1);color:#01579B}
    .cat-general{background:rgba(12,31,61,.08);color:var(--navy)}
    .cat-prohibition{background:rgba(120,40,140,.1);color:#6B2179}

    .fatwa-question-box { background: var(--white); border: 1px solid var(--border); border-left: 6px solid var(--gold); border-radius: 8px; padding: 2rem; margin-bottom: 2.5rem; position: relative; overflow: hidden; }
    .question-label { display: inline-flex; align-items: center; gap: .5rem; background: var(--navy); border: 1px solid var(--navy); color: var(--gold-light); font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .85rem; border-radius: 50px; margin-bottom: 1rem; }
    .fatwa-question-text { color: var(--navy); font-size: 1.05rem; line-height: 1.8; margin: 0; }
    .answer-label { display: inline-flex; align-items: center; gap: .5rem; background: rgba(176,141,59,.12); border: 1px solid rgba(176,141,59,.3); color: var(--gold-dark); font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .85rem; border-radius: 50px; margin-bottom: 1.25rem; }
    .fatwa-answer-arabic { text-align: center; direction: rtl; color: var(--gold-dark); font-weight: 700; margin: 0 0 1.5rem; }
    .fatwa-answer-body { font-size: .97rem; line-height: 1.9; color: #444; }
    .fatwa-answer-body p { margin-bottom: 1.1rem; }
    .fatwa-answer-body strong { font-weight: 700; color: var(--navy); }
    .fatwa-answer-body u { text-decoration: underline; }
    .refs-heading { font-size: .88rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #888; margin: 1.75rem 0 .85rem; padding-top: 1.5rem; border-top: 2px solid #eee; }
    .refs-heading i { color: var(--gold); margin-right: .4rem; }
    .refs-body { font-family: 'Amiri', serif; font-size: 1.15rem; line-height: 2; color: #1a1a1a; }

    .fatwa-closing { margin-top: 2.5rem; border-top: 2px solid #eee; padding-top: 2rem; }
    .allah-knows-best { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-style: italic; color: var(--navy); margin-bottom: 1.75rem; display: flex; align-items: center; gap: .6rem; }
    .allah-knows-best::before { content: ''; display: inline-block; width: 4px; height: 1.2em; background: var(--gold); border-radius: 2px; flex-shrink: 0; }
    .attribution-list { display: flex; flex-direction: column; gap: 1rem; }
    .attr-role { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #888; margin-bottom: .15rem; }
    .attr-name { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--navy); font-weight: 600; margin-bottom: .1rem; }
    .attr-title { font-size: .83rem; color: #555; }
    .fatwa-meta-footer {
      display: flex; align-items: center; flex-wrap: wrap; gap: .85rem;
      margin-top: 2rem; padding-top: 1.75rem; border-top: 2px solid #eee;
    }

    .fatwa-not-found { text-align: center; padding: 4rem 1rem; }
    .fatwa-not-found i { font-size: 2.5rem; color: var(--border); margin-bottom: 1rem; display: block; }

    .fatwa-share { display: flex; gap: .6rem; margin-top: 2.5rem; }
    .fatwa-share a, .fatwa-share button { background: var(--off-white); border: 1px solid var(--border); color: var(--text-muted); padding: .5rem 1rem; border-radius: 50px; font-size: .8rem; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; }
    .fatwa-share a:hover, .fatwa-share button:hover { border-color: var(--gold); color: var(--gold-dark); }

    /* ---- Serial number + prev/next navigation (bottom of every fatwa page) ---- */
    .fatwa-serial-line {
      text-align: center; font-size: .78rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-muted); margin: 3rem auto 1rem; max-width: 1080px;
    }
    .fatwa-serial-line span { color: var(--navy); }
    .fatwa-pager {
      max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    }
    @media (max-width: 640px) { .fatwa-pager { grid-template-columns: 1fr; } }
    .fatwa-pager-link, .fatwa-pager-empty {
      display: flex; align-items: center; gap: .85rem; background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.1rem 1.3rem; transition: var(--transition); min-height: 76px;
    }
    .fatwa-pager-link:hover { border-color: var(--gold); box-shadow: var(--shadow); transform: translateY(-2px); }
    .fatwa-pager-empty { opacity: .4; }
    .fatwa-pager-next { justify-content: flex-end; text-align: right; }
    .fatwa-pager-icon { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--gold-pale); color: var(--gold-dark); display: flex; align-items: center; justify-content: center; font-size: .85rem; }
    .fatwa-pager-text { min-width: 0; }
    .fatwa-pager-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: .2rem; }
    .fatwa-pager-title { font-size: .9rem; font-weight: 600; color: var(--navy); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    /* Fatwa page typography: Times New Roman, 12pt, throughout (icons excluded) */
    .fatwa-detail-section, .fatwa-detail-section *:not(i) {
      font-family: 'Times New Roman', Times, serif !important;
      font-size: 12pt !important;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <script src="js/layout.js"></script>
  <script>layoutNav();</script>

  <section class="fatwa-detail-section">
    <div class="container">
      <a href="iftaa.html" class="fatwa-back-link"><i class="fas fa-arrow-left"></i> Back to Fatāwā</a>
      <div class="fatwa-detail-card" id="fatwa-detail">
        <div class="fatwa-not-found">
          <i class="fas fa-circle-notch fa-spin"></i>
          <p>Loading fatwā&hellip;</p>
        </div>
      </div>

      <p class="fatwa-serial-line" id="fatwa-serial-line" style="display:none;"></p>
      <nav class="fatwa-pager" id="fatwa-pager" style="display:none;"></nav>
    </div>
  </section>

  <!-- FOOTER -->
  <script>layoutFooter();</script>

  <script src="js/main.js"></script>
  <script>
  const catClass = {
    'Salah':'cat-salah','Zakaat':'cat-zakaat','Sawm':'cat-sawm','Sawm (Fasting)':'cat-sawm',
    'Business & Finance':'cat-business','Food & Drink':'cat-food','Marriage & Family':'cat-marriage',
    'Divorce':'cat-divorce','Purification':'cat-purification','Funerals':'cat-funerals',
    'Hajj & Umrah':'cat-hajj','Inheritance':'cat-inheritance','Endowments':'cat-endowments',
    'Oaths & Vows':'cat-oaths','General':'cat-general','Prohibition & Permissibility':'cat-prohibition'
  };

  function esc(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str + 'T12:00:00');
    return isNaN(d) ? str : d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  }

  function renderNotFound() {
    document.getElementById('fatwa-detail').innerHTML = `
      <div class="fatwa-not-found">
        <i class="fas fa-scroll"></i>
        <h2 style="margin-bottom:.5rem;">Fatwā not found</h2>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">This fatwā may have been moved or removed.</p>
        <a href="iftaa.html" class="btn btn-navy"><i class="fas fa-arrow-left"></i> Browse Fatāwā</a>
      </div>`;
    document.getElementById('fatwa-serial-line').style.display = 'none';
    document.getElementById('fatwa-pager').style.display = 'none';
  }

  // ── Serial number + prev/next, using the same canonical (oldest-first) order as the cards ──
  function renderPager(ordered, index) {
    const total = ordered.length;
    document.getElementById('fatwa-serial-line').innerHTML =
      `Fatwā <span>No. ${index + 1}</span> of <span>${total}</span>`;
    document.getElementById('fatwa-serial-line').style.display = 'block';

    const prev = index > 0 ? ordered[index - 1] : null;
    const next = index < total - 1 ? ordered[index + 1] : null;

    function side(f, label, dir) {
      if (!f) return `<div class="fatwa-pager-empty${dir === 'next' ? ' fatwa-pager-next' : ''}"></div>`;
      const icon = dir === 'prev' ? '<i class="fas fa-arrow-left"></i>' : '<i class="fas fa-arrow-right"></i>';
      const inner = `
        <div class="fatwa-pager-text">
          <div class="fatwa-pager-label">${label}</div>
          <div class="fatwa-pager-title">${esc(f.title)}</div>
        </div>`;
      const iconEl = `<span class="fatwa-pager-icon">${icon}</span>`;
      return `<a href="fatwa.html?slug=${encodeURIComponent(f.slug)}" class="fatwa-pager-link${dir === 'next' ? ' fatwa-pager-next' : ''}">${dir === 'prev' ? iconEl + inner : inner + iconEl}</a>`;
    }

    document.getElementById('fatwa-pager').innerHTML =
      side(prev, 'Previous Fatwā', 'prev') + side(next, 'Next Fatwā', 'next');
    document.getElementById('fatwa-pager').style.display = 'grid';
  }

  function renderFatwa(f) {
    document.title = f.title + ' — Darul Iftaa New York';
    const cls = catClass[f.category] || 'cat-general';
    const refsHtml = (f.references || '').toString().trim();
    const refsBlock = refsHtml.replace(/<[^>]+>/g,'').trim() ? `
      <h4 class="refs-heading"><i class="fas fa-book-open"></i> References</h4>
      <div class="refs-body">${DunyBidi.wrap(refsHtml)}</div>` : '';

    document.getElementById('fatwa-detail').innerHTML = `
      <h1 class="fatwa-detail-title">${esc(f.title)}</h1>

      <div class="fatwa-question-box">
        <span class="question-label"><i class="fas fa-question-circle"></i> The Question</span>
        <div class="fatwa-question-text">${DunyBidi.wrap(f.question) || '<em>No question recorded.</em>'}</div>
      </div>

      <span class="answer-label"><i class="fas fa-check-circle"></i> The Answer</span>
      <p class="fatwa-answer-arabic">الجواب بملهم الصدق و الصواب</p>
      <div class="fatwa-answer-body">${DunyBidi.wrap(f.answer) || '<em>No answer recorded.</em>'}</div>

      <div class="fatwa-closing">
        <p class="allah-knows-best">And Allah ﷻ knows best.</p>
        <div class="attribution-list">
          ${f.written_by ? `
          <div class="attr-entry">
            <div class="attr-role">Written by</div>
            <div class="attr-name">${esc(f.written_by)}</div>
            <div class="attr-title">Student, Darul Iftā, Darul Uloom New York</div>
          </div>` : ''}
          <div class="attr-entry">
            <div class="attr-role">Checked &amp; Approved by</div>
            <div class="attr-name">Mufti Mizanur Rahman</div>
            <div class="attr-title">Head Mufti, Darul Iftāʾ</div>
          </div>
          <div class="attr-entry">
            <div class="attr-role">Checked &amp; Approved by</div>
            <div class="attr-name">Mufti Manzoor Ahmad</div>
            <div class="attr-title">Senior Mufti, Darul Iftāʾ</div>
          </div>
        </div>

        ${refsBlock}

        <div class="fatwa-meta-footer">
          <span class="fatwa-detail-date">${formatDate(f.date)}</span>
          <span class="fatwa-cat-badge ${cls}"><i class="fas fa-scale-balanced"></i> ${esc(catLabel(f.category))}</span>
        </div>

        ${f.pdf_url ? `<div class="lib-actions" style="margin-bottom:1rem;">
          <a class="btn btn-navy lib-btn" href="reader.html?type=fatawaas&id=${encodeURIComponent(f.slug)}"><i class="fas fa-book-open"></i> Read the PDF</a>
          <a class="btn btn-outline-gold lib-btn" href="${esc(f.pdf_url)}" target="_blank" rel="noopener"><i class="fas fa-download"></i> Download PDF</a>
        </div>` : ''}

        <div class="fatwa-share">
          <a href="iftaa.html"><i class="fas fa-arrow-left"></i> Back to Fatāwā</a>
        </div>
      </div>`;
  }

  async function loadAndRender() {
    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) { renderNotFound(); return; }

    const all = await DunyFatwaData.loadAllFatwas();
    const found = all.find(f => f.slug === slug);
    if (!found) { renderNotFound(); return; }

    renderFatwa(found);

    // Serial number + prev/next only make sense within the public (non-hidden) archive —
    // an admin previewing a hidden fatwa still sees the content, just no pager.
    const ordered = DunyFatwaData.canonicalOrder(all);
    const index = ordered.findIndex(f => f.slug === slug);
    if (index === -1) {
      document.getElementById('fatwa-serial-line').style.display = 'none';
      document.getElementById('fatwa-pager').style.display = 'none';
      return;
    }
    renderPager(ordered, index);
  }
  loadAndRender();
  </script>
</body>
</html>
