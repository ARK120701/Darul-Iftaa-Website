  <script>
    var FACULTY = [
 {
  "id": "mizaanur-rahman",
  "name": "Muftī Mizanur Rahman Sayed",
  "title": "Head Muftī",
  "bio": ["Muftī Mizanur Rahman Sayed is a Bangladeshi Islamic scholar and jurist. He was one of five scholars selected by the Islamic Foundation Bangladesh to serve as fatwa interpreters, a recognition of his standing in Islamic jurisprudence.", "He began his studies at Al-Jamiah Al-Ashrafiyyah in Fulgazi, Feni District, and continued at Al-Jamiah Al-Islamiah Patiya and Al-Jamiatul Ahlia Darul Ulum Moinul Islam for his secondary education. He then travelled to Darul Uloom Karachi for higher studies, where he completed Dawrah Ḥadīth and specialized in Islamic law and fiqh. He also earned a diploma in Arabic literature from Imām Muḥammad ibn Saʿūd Islamic University in Riyadh.", "Muftī Mizanur Rahman is the founding principal of Farukia Islamia Madrasah in Feni. On 26 January 2012 he established the Sheikh Zakariyyah Islamic Research Center, where he serves as head and chief muftī. He is also Shaykh al-Ḥadīth at Al-Madrasatul Arabia Baitussalam in Uttara, Dhaka, and has served as education secretary of the Islamic Research Center Bangladesh.", "In 2025, Muftī Mizanur Rahman joined the staff of Darul Uloom New York as the primary muftī of Darul Iftāʾ, where he oversees the issuing of fatwas and guides the department’s work in serving the community’s religious needs."]
 },
 {
  "id": "manzoor-ahmad",
  "name": "Muftī Manzoor Ahmad",
  "title": "Senior Muftī",
  "bio": [
   "Born in Peshawar, Pakistan, Manzoor Ahmad began his studies at Darul Uloom Karachi, founded by Muftī Shafi Uthmani, in 1987 and graduated in 1997. There he studied with noble scholars including Muftī Taqi Uthmani, Muftī Azam-e Pakistan Muftī Rafi Uthmani and Shaykh al-Ḥadīth Shaban Mahmood.",
   "In 1998 he specialized in fiqh at Jamia Usmania, Peshawar, earning the title Muftī under the guidance of Muftī Ghulumur Rahman. He then taught Islamic law at the University of Peshawar on a contract basis until 2002, after which he completed a bachelor's degree in law (LL.B. Shariah and Law), graduating with honors, at the International Islamic University, Islamabad. He taught at various prestigious institutions in Pakistan before joining Darul Uloom New York in 2010.",
   "At DUNY he teaches the Dawrah, Mishkat, Khamisa and Iftāʾ classes, with books including Uṣūl al-Shāshī, Hidayah, Nūr al-Anwār and Sharḥ Maʿānī al-Āthār (Ṭaḥāwī). He is fluent in Urdu, Pashto, Arabic and English, and lives in Brooklyn, New York with his family."
  ]
 },
 {
  "id": "yusuf-chowdhury",
  "name": "Muftī Yusuf Chowdhury",
  "title": "Associate Muftī",
  "bio": [
   "Muftī Yusuf Chowdhury began his Islamic education by memorizing the Holy Qurʾān at his local Tahfīẓ al-Qurʾān madrasah, completing his memorization in 2012. After moving to New York in 2013, he enrolled in the ʿĀlimiyyah program at Darul Uloom New York, where he pursued the traditional Islamic sciences and completed his studies in 2020.",
   "To further specialize in Islamic jurisprudence, Muftī Yusuf Chowdhury enrolled in the Iftāʾ program at Darul Iftaa Chicago. He completed the program in 2022, advancing his training in applied Islamic law and the formulation of religious verdicts.",
   "Muftī Yusuf Chowdhury currently teaches in the ʿĀlimiyyah program at Darul Uloom New York and serves as an Associate Muftī. In addition to his scholarly and teaching responsibilities, he helps organize programs and coordinate fundraising initiatives that support the institute’s educational and religious activities."
  ]
 },
 {
  "id": "mahdi-alam",
  "name": "Muftī Mahdi Alam",
  "title": "Associate Instructor",
  "bio": [
   "Muftī Mahdi Alam was born and raised in New York City. He memorized the Holy Qurʾān at Darul Uloom New York and remained there for the ʿĀlim course before transferring to Darul Qurʾān wa Sunnah in New York. His final years of study took him to Darul Uloom Azaadville, South Africa, where he completed the ʿĀlimiyyah and Iftāʾ programs, studying ḥadīth under Shaykh al-Ḥadīth Mawlānā Fazlur Rahman Azemi and earning the status of Muftī in two years under Muftī Muhammad Saeed Motara and Muftī Masood Cassim.",
   "He then moved to Dhaka, Bangladesh, where he spent two years studying 'ulum al-ḥadīth (ḥadīth sciences) at Markaz al-Da'wah al-Islamiyyah under Mawlānā Muhammad Abdul Malik. He also holds a BA in philosophy and Middle Eastern Studies from Columbia University.",
   "He holds ijāzah in Fiqh, Tafsīr and Ḥadīth and takhaṣṣuṣ in both Fiqh and Ḥadīth, and is qualified to issue legal verdicts (Fatwā), grant qualifications in Ḥadīth and teach from the blessed books. At DUNY, where he began his quest for knowledge as a child, he teaches the final two years of Mishkāt al-Maṣābīḥ and Dawrah Ḥadīth, using books such as Sharh Nukhba and the Muwaṭṭaʾ of Imām Muhammad and Imām Malik. He also serves as a chaplain at Pilgrim Hospital in Brentwood."
  ]
 },
 {
  "id": "fathi-alam",
  "name": "Mawlānā Fathi Alam",
  "title": "Associate Instructor",
  "bio": null
 },
 {
  "id": "suhel-teli",
  "name": "Mawlānā Suhel Teli",
  "title": "Associate Instructor",
  "bio": [
   "Mawlānā Suhel Teli graduated from Stuyvesant High School in New York City in 1991. He subsequently attended Columbia University, where he pursued undergraduate studies in biochemistry and pre-medical studies. During his three years at Columbia, he earned a place on the honor roll each semester. He ultimately chose to pursue Islamic scholarship, traveling to Karachi, Pakistan, to enroll at Jamia Binoria.",
   "Mawlānā Suhel Teli completed the traditional ʿĀlimiyyah course at Jamia Binoria in 2000. Following his studies, he became involved in Islamic education in the United States and currently teaches in the ʿĀlim Boys department at Darul Uloom New York. In addition to teaching, he works in academics and homeschooling, contributing to educational efforts in different settings.",
   "An important influence on Mawlānā Suhel Teli’s approach to religious service was advice he received from one of his teachers in Karachi. While Mawlānā Suhel Teli was in Raiwind, his teacher advised him: “Suhel, do anything and everything, but take time out daily for tablīgh.” Mawlānā Suhel Teli strives to live by this principle, maintaining a commitment to tablīgh alongside his educational and professional responsibilities."
  ]
 }
];
    var id = new URLSearchParams(location.search).get('t');
    var p = FACULTY.filter(function (f) { return f.id === id; })[0];
    if (!p) {
      document.title = 'Biography not found — Darul Iftaa New York';
      document.getElementById('hero-name').textContent = 'Biography not found';
      document.getElementById('crumb').textContent = 'Not found';
      document.querySelector('.faculty-bio-sidebar').style.display = 'none';
      document.querySelector('.faculty-bio-grid').style.gridTemplateColumns = '1fr';
      document.getElementById('bio-body').innerHTML = '<div class="bio-coming-soon"><i class="fas fa-user-slash"></i><h3>We could not find that faculty member</h3><p>Please return to the faculty page and choose a name from the list.</p></div>';
    } else {
      var idx = FACULTY.indexOf(p), nav = document.querySelector('.faculty-nav-links');
      [[-1, 'fa-arrow-left', 'Previous'], [1, 'fa-arrow-right', 'Next']].forEach(function (d) {
        var o = FACULTY[idx + d[0]]; if (!o) return;
        var a = document.createElement('a'); a.className = 'btn btn-outline-gold'; a.href = 'faculty-bio.html?t=' + o.id;
        a.textContent = (d[0] < 0 ? 'Previous: ' : 'Next: ') + o.name; nav.appendChild(a);
      });
      document.title = p.name + ' \u2014 Darul Iftaa New York';
      document.getElementById('crumb').textContent = p.name;
      document.getElementById('hero-name').textContent = p.name;
      document.getElementById('bio-name').textContent = p.name;
      document.getElementById('bio-title').textContent = p.title;
      var body = document.getElementById('bio-body');
      if (p.bio) {
        p.bio.forEach(function (t) {
          var el = document.createElement('p'); el.className = 'faculty-bio-text'; el.textContent = t; body.appendChild(el);
        });
      } else {
        body.innerHTML = '<div class="bio-coming-soon"><i class="fas fa-hourglass-half"></i><h3>Coming Soon</h3><p>This biography will be added shortly.</p></div>';
      }
    }
  </script>
